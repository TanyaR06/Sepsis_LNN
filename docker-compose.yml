services:
  talnet:
    build: .
    image: talnet:1.0.0
    container_name: talnet
    ports:
      - "8000:8000"
    environment:
      - TALNET_MODELS_DIR=/app/models
    # Mount trained artifacts + demo data read-only (optional; also baked into image)
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
